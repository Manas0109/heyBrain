[project]
name = "heybrain"
version = "0.1.0"
description = "A laptop-first personal thinking and memory assistant."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic[bedrock]>=0.34",
    "boto3>=1.34",
    "chromadb>=0.5",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
brain = "heybrain.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heybrain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
