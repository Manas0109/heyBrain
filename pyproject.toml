[project]
name = "heybrain"
version = "0.1.0"
description = "A laptop-first personal thinking and memory assistant."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain-aws>=0.1",
    "boto3>=1.34",
    "chromadb>=0.5",
    "rich>=13.7",
    "questionary>=2.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
brain = "heybrain.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heybrain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: needs real hardware/models and real wall-clock time; opt-in via HEYBRAIN_RUN_SLOW_TESTS=1",
    "live_eval: needs real Bedrock credentials; opt-in via HEYBRAIN_RUN_LIVE_EVAL=1",
]
